<section class="pagina">
  <header class="pagina__topo">
    <div>
      <p class="pagina__rotulo">SUA CONTA</p>
      <h1 class="pagina__titulo">Perfil</h1>
    </div>
  </header>

  @if (erro()) {
    <div class="alerta-erro" role="alert">{{ erro() }}</div>
  }

  <div class="perfil">
    @if (perfil(); as dados) {
      <app-cartao-perfil
        [nome]="dados.first_name + ' ' + dados.last_name"
        [email]="dados.email"
        [foto]="dados.photo"
        [tipoDeConta]="tipoDeConta()"
      >
        <button class="btn-secundario perfil__editar" type="button" (click)="editarPerfil()">
          <i class="bi bi-pencil" aria-hidden="true"></i> Editar perfil
        </button>
      </app-cartao-perfil>
    }

    <div class="perfil__acoes">
      @if (facade.isGuide()) {
        <button class="btn-secundario" type="button" (click)="abrirFavoritos()"><i class="bi bi-heart" aria-hidden="true"></i> Seus favoritos</button>
      }
      @if (facade.myRole() === 'ADMIN') {
        <button class="btn-primary" type="button" (click)="abrirMeusPasseios()">Passeios da plataforma</button>
      }
      <button class="btn-secundario" type="button" (click)="sair()">Sair da conta</button>
    </div>
  </div>
</section>
