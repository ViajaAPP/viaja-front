<section class="pagina registrar">
  <header class="pagina__topo">
    <button class="pagina__voltar" type="button" aria-label="Voltar" (click)="voltar()">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
    </button>
    <div>
      <p class="pagina__rotulo">CRIAR CONTA</p>
      <h1 class="pagina__titulo">Vamos começar</h1>
    </div>
  </header>

  @if (erro()) {
    <div class="alerta-erro" role="alert">{{ erro() }}</div>
  }

  <form class="formulario" (ngSubmit)="cadastrar()">
    <app-campo-foto [foto]="previa()" (escolhida)="escolherFoto($event)" (removida)="removerFoto()" />

    <label for="tipo">Você é</label>
    <select id="tipo" name="role" [(ngModel)]="cadastro.role">
      @for (tipo of tiposDeConta; track tipo.role) {
        <option [value]="tipo.role">{{ tipo.label }}</option>
      }
    </select>

    <div class="formulario__linha">
      <div>
        <label for="nome">Nome <span class="obrigatorio">*</span></label>
        <input id="nome" name="first_name" [(ngModel)]="cadastro.first_name" required />
      </div>
      <div>
        <label for="sobrenome">Sobrenome <span class="obrigatorio">*</span></label>
        <input id="sobrenome" name="last_name" [(ngModel)]="cadastro.last_name" required />
      </div>
    </div>

    <label for="usuario">Nome de usuário <span class="obrigatorio">*</span></label>
    <input id="usuario" name="username" [(ngModel)]="cadastro.username" required />

    <label for="email">Email <span class="obrigatorio">*</span></label>
    <input id="email" type="email" name="email" [(ngModel)]="cadastro.email" required />

    <label for="senha">Senha <span class="obrigatorio">*</span></label>
    <div class="campo-senha">
      <input
        id="senha"
        [type]="senhaVisivel() ? 'text' : 'password'"
        name="password"
        [(ngModel)]="cadastro.password"
        required
      />
      <button
        class="campo-senha__olho"
        type="button"
        [attr.aria-label]="senhaVisivel() ? 'Esconder senha' : 'Mostrar senha'"
        (click)="senhaVisivel.set(!senhaVisivel())"
      >
        <i class="bi" [class.bi-eye]="!senhaVisivel()" [class.bi-eye-slash]="senhaVisivel()" aria-hidden="true"></i>
      </button>
    </div>

    <label for="telefone">Telefone <span class="obrigatorio">*</span></label>
    <input id="telefone" type="tel" name="phone" [(ngModel)]="cadastro.phone" required />

    @if (pedeCnpj()) {
      <label for="cnpj">CNPJ da sua empresa de turismo <span class="obrigatorio">*</span></label>
      <input id="cnpj" name="cnpj" [(ngModel)]="cadastro.cnpj" required />
    }

    <button class="btn-primary mt-1" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Criando sua conta...' : 'Criar conta' }}
    </button>
  </form>

  <p class="registrar__login">
    Já tem uma conta? <button type="button" (click)="irParaLogin()">Entrar</button>
  </p>
</section>
