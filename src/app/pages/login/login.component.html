<div class="login-container">
    <div class="login-container__logo"></div>

    <div class="login-container__content">
      <div class="login-container__form">
          <h1>Bem-vindo de volta!</h1>
          <p>Faça login para continuar</p>
          <form (submit)="login()">
              <input type="text" placeholder="Email" [(ngModel)]="credentials.email" name="email" required>
              <input type="password" placeholder="Senha" [(ngModel)]="credentials.password" name="password" required>
              <button type="submit">Entrar</button>
          </form>
      </div>
    </div>
</div>
