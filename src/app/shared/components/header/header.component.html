<header class="app-header">
  <div class="header__user">
    @if (dados?.user?.fotoUser) {
      <img class="header__avatar" [src]="dados?.user?.fotoUser" [alt]="dados?.user?.name" />
    } @else {
      <span class="header__avatar header__avatar--inicial" aria-hidden="true">{{ (dados?.user?.name || '?').charAt(0) }}</span>
    }
    <div class="header__text">
      <p class="header__greeting">{{ dados?.greeting }} <span class="header__name">{{ dados?.user?.name }}</span></p>
      <h1 class="header__titulo">{{ dados?.titulo }}</h1>
    </div>
  </div>

  <div class="header__actions">
    <button class="header__icon-btn" type="button" aria-label="Avisos"></button>
  </div>
</header>

@if (mostrarBusca) {
  <div class="buscar-filtros">
    <button class="buscar" type="button" (click)="abrirBusca()">
      <i class="bi bi-search buscar__lupa" aria-hidden="true"></i>
      <span class="buscar__textos">
        <span class="buscar__titulo">Para onde vamos?</span>
        <span class="buscar__dica">Cidades, passeios e lugares</span>
      </span>
    </button>

    <button class="filtro-btn" type="button" aria-label="Filtrar passeios" (click)="abrirFiltros()">
      <i class="bi bi-sliders" aria-hidden="true"></i>
    </button>
  </div>
}
